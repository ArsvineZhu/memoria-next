[package]
name = "memoria-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
memoria-types = { version = "0.1.0", path = "../memoria-types" }
memoria-adaptive = { version = "0.1.0", path = "../memoria-adaptive" }
memoria-authority = { version = "0.1.0", path = "../memoria-authority" }
memoria-mdx = { version = "0.1.0", path = "../memoria-mdx" }
memoria-derived = { version = "0.1.0", path = "../memoria-derived" }
memoria-query = { version = "0.1.0", path = "../memoria-query" }
thiserror = "2.0.20"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "=0.1.44"
moka = { version = "=0.12.15", features = ["sync"] }

[dev-dependencies]
# Enables memoria-mdx's test-only IR counter for this crate's integration tests.
memoria-mdx = { version = "0.1.0", path = "../memoria-mdx", features = ["test-support"] }
tempfile = "3.27.0"
