[package]
name = "memoria-napi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-link = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.0.0", features = ["async"] }
napi-derive = "3.0.0"
memoria-authority = { version = "0.1.0", path = "../memoria-authority" }
memoria-types = { version = "0.1.0", path = "../memoria-types" }
memoria-adaptive = { version = "0.1.0", path = "../memoria-adaptive" }
memoria-mdx = { version = "0.1.0", path = "../memoria-mdx" }
memoria-runtime = { version = "0.1.0", path = "../memoria-runtime" }
memoria-query = { version = "0.1.0", path = "../memoria-query" }

[build-dependencies]
napi-build = "1.0.1"
